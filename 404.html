<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Mamá Resuelve</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#C2542C">
<!-- Enlaces absolutos a propósito: esta página se sirve en cualquier ruta rota,
     así que las rutas relativas no funcionarían. Cambiar junto con el dominio. -->
<link rel="icon" type="image/png" sizes="32x32" href="https://elevora01.github.io/mama-resuelve/assets/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Figtree:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --cream:#FBF3E6; --paper:#FFFBF3; --ink:#2A2119; --ink-soft:#5B4E41; --terra:#C2542C; --terra-deep:#9B3F1D; }
  *,*::before,*::after{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; min-height:100svh; display:grid; place-items:center;
    padding:24px 18px; background:var(--cream); color:var(--ink);
    font-family:"Figtree",ui-sans-serif,system-ui,sans-serif; line-height:1.6;
  }
  .card{
    width:100%; max-width:520px; background:var(--paper);
    border:2px solid var(--ink); border-radius:18px; box-shadow:6px 6px 0 var(--ink);
    padding:clamp(28px,6vw,48px); text-align:left;
  }
  .code{ font-family:"Fraunces",Georgia,serif; font-weight:900; font-size:clamp(4rem,14vw,6.5rem);
         line-height:.9; color:var(--terra); letter-spacing:-.03em; margin:0 0 .15em; }
  h1{ font-family:"Fraunces",Georgia,serif; font-weight:900; font-size:clamp(1.5rem,5vw,2rem);
      line-height:1.15; letter-spacing:-.015em; margin:0 0 .5em; text-wrap:balance; }
  p{ margin:0 0 1.6em; color:var(--ink-soft); font-weight:500; }
  .btn{
    display:inline-flex; align-items:center; gap:.5em; text-decoration:none;
    background:var(--terra); color:#fff; font-weight:800; font-size:1rem;
    padding:.9em 1.4em; border:2px solid var(--ink); border-radius:999px; box-shadow:4px 4px 0 var(--ink);
    transition:transform .15s, box-shadow .15s;
  }
  .btn:hover{ transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink); }
  .btn:active{ transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink); }
  .btn:focus-visible{ outline:3px solid var(--terra-deep); outline-offset:3px; }
  @media (prefers-reduced-motion:reduce){ .btn{ transition:none; } }
</style>
</head>
<body>
  <main class="card">
    <p class="code" aria-hidden="true">404</p>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté incompleto o que la página se haya movido. Las 200 recetas siguen donde siempre.</p>
    <a class="btn" href="https://elevora01.github.io/mama-resuelve/">Ir a Mamá Resuelve <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
